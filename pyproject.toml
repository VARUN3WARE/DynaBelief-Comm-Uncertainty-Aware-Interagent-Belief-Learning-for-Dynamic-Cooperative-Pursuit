[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynabelief"
version = "0.1.0"
description = "DynaBelief-Comm: uncertainty-aware interagent belief learning for dynamic cooperative pursuit"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Varun Rao" },
    { name = "Sarthak Gopal Sharma" },
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pettingzoo>=1.25,<1.26",
    # Pursuit's own imports; pettingzoo[sisl] would also pull box2d-py (SWIG/C++ build)
    "pygame>=2.3",
    "scipy>=1.10",
    "gymnasium>=1.0,<2",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]
viz = [
    "tensorboard>=2.15",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # pygame (imported by Pursuit) uses the deprecated pkg_resources API on newer setuptools
    "ignore:pkg_resources is deprecated:DeprecationWarning:pygame.pkgdata",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# tests deliberately exercise the legacy global NumPy RNG that seed_everything sets
"tests/*" = ["NPY002"]
